<!DOCTYPE html>
<html>
<head>
    <title>Create User</title>
</head>
<body>
<h1>Create User</h1>
<form method="POST" th:action="@{/users/create}">
    <label>Name:</label>
    <input type="text" name="name" required/>
    <br/>
    <label>Email:</label>
    <input type="email" name="email" required/>
    <br/>
    <button type="submit">Create</button>
</form>
</body>
</html>
