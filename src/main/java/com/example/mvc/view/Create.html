<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="Create">Create</title>
</head>
<body>
<h1>Create</h1>
<h4>Movie</h4>
<hr/>
<div class="row">
    <div class="col-md-4">
        <form th:action="@{/Movies/Create}" method="post" th:object="${movie}">
            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error.message}" style="color:red"></p>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('title')} ? 'has-error'">
                <label for="title" class="control-label">title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control"/>
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="help-block"></span>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('rating')} ? 'has-error'">
                <label for="rating" class="control-label">rating</label>
                <input type="text" id="rating" th:field="*{rating}" class="form-control"/>
                <span th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" class="help-block"></span>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('releaseDate')} ? 'has-error'">
                <label for="releaseDate" class="control-label">Release Date</label>
                <input type="date" id="releaseDate" th:field="*{releaseDate}" class="form-control"/>
                <span th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}" class="help-block"></span>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('genre')} ? 'has-error'">
                <label for="genre" class="control-label">genre</label>
                <input type="text" id="genre" th:field="*{genre}" class="form-control"/>
                <span th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}" class="help-block"></span>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('price')} ? 'has-error'">
                <label for="price" class="control-label">price</label>
                <input type="text" id="price" th:field="*{price}" class="form-control"/>
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="help-block"></span>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Create</button>
                <a th:href="@{/Movies/Index}" class="btn btn-default">Back to List</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
