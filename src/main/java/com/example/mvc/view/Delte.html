<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete</title>
</head>
<body>
<h1>Delete</h1>

<h3>Are you sure you want to delete this?</h3>
<div>
  <h4>Movie</h4>
  <hr />
  <dl class="row">
    <dt class = "col-sm-2">
      Title
    </dt>
    <dd class = "col-sm-10">
      ${movie.title}
    </dd>
    <dt class="col-sm-2">
      Rating
    </dt>
    <dd class="col-sm-10">
      ${movie.rating}
    </dd>
    <dt class = "col-sm-2">
      Release Date
    </dt>
    <dd class = "col-sm-10">
      ${movie.releaseDate}
    </dd>
    <dt class = "col-sm-2">
      Genre
    </dt>
    <dd class = "col-sm-10">
      ${movie.genre}
    </dd>
    <dt class = "col-sm-2">
      Price
    </dt>
    <dd class = "col-sm-10">
      ${movie.price}
    </dd>
  </dl>

  <form action="/delete/${movie.id}" method="post">
    <input type="hidden" name="_method" value="DELETE">
    <input type="submit" value="Delete" class="btn btn-danger" /> |
    <a href="/movies">Back to List</a>
  </form>
</div>
</body>
</html>
