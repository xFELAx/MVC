<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Details</title>
</head>
<body>
<h1>Details</h1>

<div>
  <h4>Movie</h4>
  <hr />
  <dl class="row">
    <dt class = "col-sm-2">
      Title
    </dt>
    <dd class = "col-sm-10">
      ${movie.title}
    </dd>
    <dt class="col-sm-2">
      Rating
    </dt>
    <dd class="col-sm-10">
      ${movie.rating}
    </dd>
    <dt class = "col-sm-2">
      Release Date
    </dt>
    <dd class = "col-sm-10">
      ${movie.releaseDate}
    </dd>
    <dt class = "col-sm-2">
      Genre
    </dt>
    <dd class = "col-sm-10">
      ${movie.genre}
    </dd>
    <dt class = "col-sm-2">
      Price
    </dt>
    <dd class = "col-sm-10">
      ${movie.price}
    </dd>
  </dl>
</div>
<div>
  <a href="/edit/${movie.id}">Edit</a> |
  <a href="/movies">Back to List</a>
</div>
</body>
</html>
