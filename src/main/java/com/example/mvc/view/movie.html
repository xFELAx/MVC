<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Movies</title>
</head>
<body>
<h1>Movies</h1>
<table>
  <thead>
  <tr>
    <th>Title</th>
    <th>Genre</th>
    <th>Director</th>
    <th>Release Date</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="movie : ${movies}">
    <td th:text="${movie.title}"></td>
    <td th:text="${movie.genre}"></td>
    <td th:text="${movie.director}"></td>
    <td th:text="${movie.releaseDate}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
